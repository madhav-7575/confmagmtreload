<!-- Page scripts (login/register handlers) -->
<script>
/* ── LOGIN (server-backed) ── */
async function handleLogin(){
  hideAlert();
  const email    = document.getElementById("login-email").value.trim().toLowerCase();
  const password = document.getElementById("login-password").value;
  const btn      = document.getElementById("login-btn");
  if(!email||!password){ showAlert("Please fill in all fields."); return; }
  btn.textContent = "Signing in…"; btn.disabled = true;
  try{
    const data = await apiPost('/api/login',{email,password});
    if(data && data.user){ setSession(data.user, data.token); showAlert(`✓ Welcome back, ${data.user.name.split(' ')[0]}! Redirecting…`,'success');
      setTimeout(()=> window.location.href = `${data.user.role}_dashboard.html`, 700);
    } else {
      showAlert('Login failed: unexpected response'); btn.textContent = 'Sign In →'; btn.disabled = false;
    }
  }catch(err){
    const msg = err && err.body && err.body.error ? err.body.error : 'Login failed';
    showAlert(msg); btn.textContent = 'Sign In →'; btn.disabled = false;
  }
}

/* ── REGISTER (server-backed) ── */
async function handleRegister(){
  hideAlert();
  const name    = document.getElementById("reg-name").value.trim();
  const email   = document.getElementById("reg-email").value.trim().toLowerCase();
  const password= document.getElementById("reg-password").value;
  const college = document.getElementById("reg-college").value.trim();
  const role    = document.querySelector('input[name="role"]:checked')?.value || "author";
  const btn     = document.getElementById("reg-btn");
  if(!name||!email||!password){ showAlert("Please fill in all required fields."); return; }
  if(password.length < 6)     { showAlert("Password must be at least 6 characters."); return; }
  if(!email.includes("@"))    { showAlert("Please enter a valid email address."); return; }
  btn.textContent = "Creating account…"; btn.disabled = true;
  try{
    const data = await apiPost('/api/register',{name,email,password,role,college});
    if(data && data.user){
      // auto-login the newly registered user (server sets session cookie)
      setSession(data.user, data.token);
      showAlert(`Account created — Welcome ${data.user.name.split(' ')[0]}! Redirecting…`,'success');
      setTimeout(()=>{ window.location.href = `${data.user.role}_dashboard.html`; }, 700);
    } else {
      showAlert('Registration failed: unexpected response'); btn.textContent = 'Create Account →'; btn.disabled = false;
    }
  }catch(err){
    const msg = err && err.body && err.body.error ? err.body.error : 'Registration failed';
    showAlert(msg); btn.textContent = 'Create Account →'; btn.disabled = false;
  }
}

// Enter key support (login/register)
document.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const loginVisible = document.getElementById("login-form").style.display!=="none";
    if(loginVisible) handleLogin(); else handleRegister();
  }
});
 </script>

    .guide-step-desc{margin-bottom:12px;color:#234}
    .guide-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid rgba(10,30,60,.04);gap:8px}
    .guide-nav{background:linear-gradient(180deg,#0d7be8,#0b5ac7);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
    .guide-nav:disabled{opacity:.5;cursor:default}
    .guide-progress{flex:1;text-align:center;font-size:0.9rem;color:#07203a}
    </style>
  </div>

  <script>
/* ── Session helpers (server-backed auth) ── */
function setSession(user, token){
  try{
    if(token) user.token = token;
    localStorage.setItem("cms_session",JSON.stringify(user));
  }catch(e){ /* ignore */ }
}
function getSession(){ try{ return JSON.parse(localStorage.getItem("cms_session")||"null"); }catch(e){return null;} }

/* If already logged in, verify server session then redirect */
(async function(){
  const s = getSession();
  if(s && s.role){
    try{
      const res = await fetch('/api/whoami', { credentials: 'same-origin' });
      if(res.ok){
        const data = await res.json().catch(()=>null);
        if(data && data.user && data.user.role === s.role){
          window.location.href = `${s.role}_dashboard.html`;
          return;
        }
      }
    }catch(e){ /* ignore network errors */ }
    // server session missing or doesn't match — clear stale client session
    localStorage.removeItem('cms_session');
  }
})();


async function apiPost(path, body){
  try{
    const res = await fetch(path, {method:'POST',credentials: 'same-origin',headers:{'Content-Type':'application/json'},body: JSON.stringify(body)});
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw { status: res.status, body: data };
    return data;
  }catch(err){ throw err; }
}

/* ── Theme ── */
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem("cms_theme",next);
  updateThumb();
}
function updateThumb(){
  const isDark = document.documentElement.getAttribute("data-theme")==="dark";
  const el = document.getElementById("thumb-icon");
  if(el) el.textContent = isDark?"🌙":"☀️";
}
updateThumb();

/* ── Tab switch ── */
function switchTab(tab){
  hideAlert();
  const isLogin = tab==="login";
  const title = document.getElementById("auth-title");
  const linkWrap = document.getElementById("auth-login-link");
  const loginForm = document.getElementById("login-form");
  const registerForm = document.getElementById("register-form");
  const loginTab = document.getElementById("tab-login");
  const registerTab = document.getElementById("tab-register");
  if (title) title.textContent = isLogin ? "Login" : "Registration";
  if (linkWrap) {
    linkWrap.innerHTML = isLogin
      ? 'Click here <a href="#" onclick="switchTab(\'register\')">Register</a>'
      : 'Click here <a href="#" onclick="switchTab(\'login\')">Login</a>';
  }
  if (loginForm) loginForm.style.display = isLogin ? "flex" : "none";
  if (registerForm) registerForm.style.display = isLogin ? "none" : "flex";
  if (loginTab) loginTab.classList.toggle("active", isLogin);
  if (registerTab) registerTab.classList.toggle("active", !isLogin);
}

/* ── Password toggle ── */
function togglePwd(id, btn){
  const inp = document.getElementById(id);
  if(!inp) return;
  inp.type = inp.type==="password"?"text":"password";
  btn.textContent = inp.type==="password"?"Show":"Hide";
}

/* ── Password strength ── */
function checkStrength(val){
  const hasLen = val.length>=8;
  const hasMix = /[A-Z]/.test(val)&&/[0-9]/.test(val);
  const hasSym = /[^A-Za-z0-9]/.test(val);
  const score  = [hasLen,hasMix,hasSym].filter(Boolean).length;
  const colors = ["#e5484d","#f5a623","#00c896"];
  const labels = ["Weak — add more characters","Fair — try mixing numbers & symbols","Strong 💪"];
  ["pb1","pb2","pb3"].forEach((id,i)=>{
    document.getElementById(id).style.background = i<score ? colors[score-1] : "var(--border)";
  });
  document.getElementById("pwd-label").textContent = val.length ? (labels[score-1]||"") : "";
  document.getElementById("pwd-label").style.color = score===1?"#b91c1c":score===2?"#9a6510":"#0a7a5a";
}

/* ── Role select ── */
const roleDescs = {
  author:   "✍️ Submit research papers to conferences and track acceptance status.",
  reviewer: "🔍 Review assigned papers, score them, and submit expert feedback.",
  admin:    "⚙️ Manage conferences, assign reviewers, and publish final decisions.",
};
function selectRole(role, el){
  document.querySelectorAll(".role-tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("role-desc").textContent = roleDescs[role];
}

/* ── Demo fill ── */
function fillDemo(role){
  const map = {
    author:   {email:"author@demo.com",   password:"demo123"},
    reviewer: {email:"reviewer@demo.com", password:"demo123"},
    admin:    {email:"admin@demo.com",    password:"demo123"},
  };
  document.getElementById("login-email").value    = map[role].email;
  document.getElementById("login-password").value = map[role].password;
  showToast(`Demo ${role} credentials filled ✅`);
}

/* ── Alert ── */
function showAlert(msg, type="error"){
  const el = document.getElementById("alert-box");
  const icons = {error:"⚠️",success:"✅"};
  el.innerHTML = `${icons[type]||"ℹ️"} ${msg}`;
  el.className = `alert alert-${type} show`;
}
function hideAlert(){
  const el = document.getElementById("alert-box");
  el.className = "alert";
}

/* ── Toast ── */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove("show"), 2600);
}


</script>
<script>
// Guide data and interaction
const guideSteps = [
  { title: 'Create an account', desc: 'Register as an Author, Reviewer or Admin using the registration tab. Provide a valid email, strong password, and select your role.' },
  { title: 'Complete your profile', desc: 'After registration, open My Profile and complete affiliation details so conferences and reviewers recognize you.' },
  { title: 'Submit a paper', desc: 'From the dashboard use "Submit Paper" to create a new submission. Fill title, abstract, keywords, and upload your manuscript (PDF).' },
  { title: 'Track submission', desc: 'Check "My Submissions" to view status: Submitted, Under review, Accepted/Rejected. Notifications refresh periodically.' },
  { title: 'Manage reviews', desc: 'If you are a reviewer, accept review invitations, submit scores and comments from the Reviews panel.' },
  { title: 'Certificates & downloads', desc: 'When a paper is accepted, a completion certificate appears in Certificates — open it to preview and click Download to export your certificate.' },
  { title: 'Find & register for conferences', desc: 'Browse Conferences to find events. Register for events from the conference details page and manage your registrations in the dashboard.' },
  { title: 'Help & support', desc: 'Use contact or admin support links for account assistance, or check the docs for common workflows.' }
];
let guideIndex = 0;

function openGuide(){
  guideIndex = 0; renderGuide();
  const m = document.getElementById('guide-modal'); if(!m) return; m.classList.add('open'); m.setAttribute('aria-hidden','false'); document.getElementById('guide-body').focus();
}
function closeGuide(){
  const m = document.getElementById('guide-modal'); if(!m) return; m.classList.remove('open'); m.setAttribute('aria-hidden','true');
}
function renderGuide(){
  const step = guideSteps[guideIndex];
  const titleEl = document.getElementById('guide-title-text');
  const body = document.getElementById('guide-body');
  const prevBtn = document.getElementById('guide-prev');
  const nextBtn = document.getElementById('guide-next');
  const progress = document.getElementById('guide-progress');
  if(titleEl) titleEl.textContent = step.title;
  if(body) body.innerHTML = `<div class="guide-step-title">${guideIndex+1}. ${step.title}</div><div class="guide-step-desc">${step.desc}</div>` + renderStepActions(guideIndex);
  if(prevBtn) prevBtn.disabled = guideIndex===0;
  if(nextBtn) nextBtn.textContent = guideIndex < guideSteps.length-1 ? 'Next →' : 'Done';
  if(progress) progress.textContent = `${guideIndex+1} / ${guideSteps.length}`;
}
function renderStepActions(i){
  // add small contextual actions per step for clarity
  const examples = [
    '<ul><li>Click Register → choose a role → fill details</li></ul>',
    '<ul><li>Open Profile → Add affiliation → Save</li></ul>',
    '<ul><li>Dashboard → Submit Paper → Upload file (PDF)</li></ul>',
    '<ul><li>Open My Submissions → click title to view details & status</li></ul>',
    '<ul><li>Reviewer Dashboard → Accept invitation → Submit review</li></ul>',
    '<ul><li>Certificates → Preview → Download</li></ul>',
    '<ul><li>Conferences → View details → Register</li></ul>',
    '<ul><li>Contact admin via support link or email</li></ul>'
  ];
  return `<div style="margin-top:8px;color:#123">${examples[i]||''}</div>`;
}
function nextGuide(){ if(guideIndex < guideSteps.length-1){ guideIndex++; renderGuide(); } else { closeGuide(); } }
function prevGuide(){ if(guideIndex>0){ guideIndex--; renderGuide(); } }
// keyboard support
document.addEventListener('keydown', (e)=>{
  const m = document.getElementById('guide-modal'); if(!m || !m.classList.contains('open')) return;
  if(e.key==='Escape') closeGuide();
  if(e.key==='ArrowRight') nextGuide();
  if(e.key==='ArrowLeft') prevGuide();
});
// expose for debugging if needed
window.openGuide = openGuide; window.closeGuide = closeGuide; window.nextGuide = nextGuide; window.prevGuide = prevGuide;
</script>
